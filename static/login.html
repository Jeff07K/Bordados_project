<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Bordados</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    body { background: var(--dark-brown); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .auth-card {
      background: var(--warm-white);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo a {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--dark-brown);
      text-decoration: none;
    }
    .auth-logo span { color: var(--terracotta); }
    .auth-logo p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .divider { 
      text-align:center; 
      margin: 1.2rem 0; 
      color:var(--text-muted); 
      font-size:0.82rem;
      position:relative;
    }
    .divider::before, .divider::after {
      content:''; position:absolute; top:50%; width:42%; height:1px; background:var(--border);
    }
    .divider::before { left:0; }
    .divider::after { right:0; }
    .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.88rem; color:var(--text-muted); }
    .auth-footer a { color:var(--terracotta); font-weight:500; text-decoration:none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/">🧵 Bordados <span>Personalizados</span></a>
      <p>Ingresa a tu cuenta</p>
    </div>

    <div class="alert alert-error" id="error-msg"></div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">
      Iniciar sesión
    </button>

    <div class="divider">o</div>

    <a href="/register" class="btn btn-secondary btn-full">Crear una cuenta</a>

    <div class="auth-footer">
      <a href="/">← Volver al catálogo</a>
    </div>
  </div>

<script src="/static/js/api.js"></script>
<script>
  // Si ya está logueado, redirigir
  if (Api.isLoggedIn()) {
    window.location.href = Api.isAdmin() ? '/admin' : '/dashboard';
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    const errEl = document.getElementById('error-msg');
    const btn   = document.getElementById('login-btn');

    errEl.classList.remove('show');
    if (!email || !pass) {
      errEl.textContent = 'Completa todos los campos.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Ingresando...';

    try {
      const data = await Api.login(email, pass);
      window.location.href = data.rol === 'admin' ? '/admin' : '/dashboard';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  }

  // Enter para enviar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
